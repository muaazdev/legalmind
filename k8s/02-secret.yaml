# ============================================
# Secret: legalmind-secrets
# Sensitive credentials (API keys)
# 
# IMPORTANT: Replace the base64 values with your actual keys
# To encode: echo -n "your-api-key" | base64
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: legalmind-secrets
  namespace: legalmind
  labels:
    app: legalmind
type: Opaque
data:
  # Base64 encoded API keys
  # Replace these with your actual keys:
  # echo -n "sk-your-openai-key" | base64
  OPENAI_API_KEY: c2steW91ci1vcGVuYWkta2V5  # placeholder
  # echo -n "your-cohere-key" | base64  
  COHERE_API_KEY: eW91ci1jb2hlcmUta2V5      # placeholder

---
# ============================================
# Secret creation instructions:
# 
# Option 1: Create from literal (recommended)
# kubectl create secret generic legalmind-secrets \
#   --namespace=legalmind \
#   --from-literal=OPENAI_API_KEY=sk-your-actual-key \
#   --from-literal=COHERE_API_KEY=your-cohere-key
#
# Option 2: Edit this file with base64 encoded values
# echo -n "sk-your-actual-key" | base64
# ============================================
